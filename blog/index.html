<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blog — Aetherum.ai</title>
<meta name="description" content="The complete Aetherum.ai archive of research, perspectives and analysis on credit unions, digital assets, regulation, infrastructure and audit-native AI.">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#162848;--navy2:#0b1a2e;--copper:#D4885C;--copper2:#E8A87C;--white:#fff;--text:#E8EDF4;--muted:#9AADCC;--dim:#6B82A6}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--text);font-family:Outfit,sans-serif;-webkit-font-smoothing:antialiased}
nav{height:72px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,26,46,.97);border-bottom:1px solid rgba(255,255,255,.05)}
.brand{font:22px "DM Serif Display",serif;color:#fff;text-decoration:none}.back{color:var(--muted);text-decoration:none;font-size:14px}.back:hover{color:var(--copper2)}
main{padding:72px 60px 110px;max-width:1280px;margin:auto}.eyebrow{font:600 12px "JetBrains Mono",monospace;letter-spacing:2px;text-transform:uppercase;color:var(--copper);margin-bottom:16px}
h1{font:52px/1.08 "DM Serif Display",serif;margin:0 0 16px;color:#fff}.intro{font-size:18px;font-weight:300;line-height:1.65;color:var(--muted);max-width:700px;margin:0 0 42px}
.tools{display:flex;gap:14px;align-items:center;margin-bottom:20px}.search{width:min(560px,100%);padding:13px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:#fff;font:15px Outfit,sans-serif;outline:none}.search:focus{border-color:var(--copper)}.count{font:12px "JetBrains Mono",monospace;color:var(--dim);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:34px}.filter{border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);border-radius:999px;padding:8px 13px;font:500 12px Outfit,sans-serif;cursor:pointer}.filter:hover,.filter.active{border-color:rgba(212,136,92,.55);color:var(--copper2);background:rgba(212,136,92,.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{display:block;text-decoration:none;padding:26px;border:1px solid rgba(255,255,255,.07);border-radius:15px;background:rgba(255,255,255,.03);transition:.25s}.card:hover{transform:translateY(-3px);border-color:rgba(212,136,92,.3);background:rgba(255,255,255,.045)}
.meta{font:11px "JetBrains Mono",monospace;letter-spacing:.7px;text-transform:uppercase;color:var(--copper);margin-bottom:13px}.card h2{font-size:17px;line-height:1.4;color:#fff;margin:0 0 10px}.card p{font-size:14px;line-height:1.6;color:var(--muted);font-weight:300;margin:0 0 18px}.read{font-size:13px;font-weight:600;color:var(--copper)}.empty{grid-column:1/-1;color:var(--muted);padding:40px 0}
footer{border-top:1px solid rgba(255,255,255,.06);padding:26px 60px;color:var(--dim);font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){nav{padding:0 24px}main{padding:52px 24px 80px}h1{font-size:39px}.tools{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}footer{padding:24px}}
</style></head>
<body>
<nav><a class="brand" href="/">Aetherum</a><a class="back" href="/">← Back to Aetherum.ai</a></nav>
<main>
<div class="eyebrow">Aetherum.ai Archive</div>
<h1>Aetherum Blog Library</h1>
<p class="intro">The complete archive of Aetherum research, perspectives and analysis across credit unions, digital assets, regulation, infrastructure and audit-native AI.</p>
<div class="tools"><input id="search" class="search" type="search" placeholder="Search articles…" aria-label="Search articles"><span id="count" class="count"></span></div>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"><div class="empty">Loading the library…</div></div>
</main>
<footer>© 2026 Aetherum, Inc. All rights reserved.</footer>
<script>
const cats={
"All":()=>true,
"Credit Unions":p=>/credit union|member|CU\b/i.test(p.title+" "+p.excerpt),
"Digital Assets":p=>/crypto|digital.asset|bitcoin|stablecoin|token|on-chain|onchain|blockchain/i.test(p.title+" "+p.excerpt),
"Regulation":p=>/CLARITY|GENIUS|SEC|OCC|NCUA|regulat|compliance|examiner/i.test(p.title+" "+p.excerpt),
"Infrastructure":p=>/infrastructure|rail|settlement|wallet|custod|key|ERC-|identity|transaction/i.test(p.title+" "+p.excerpt),
"AI & Compliance":p=>/\bAI\b|audit|underwriting|model|compliance/i.test(p.title+" "+p.excerpt)
};
let posts=[],active="All";
const grid=document.getElementById("grid"),search=document.getElementById("search"),count=document.getElementById("count"),filters=document.getElementById("filters");
Object.keys(cats).forEach(name=>{const b=document.createElement("button");b.className="filter"+(name==="All"?" active":"");b.textContent=name;b.onclick=()=>{active=name;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.textContent===name));render()};filters.appendChild(b)});
function render(){const q=search.value.trim().toLowerCase();const visible=posts.filter(p=>cats[active](p)&&(!q||(p.title+" "+p.excerpt+" "+p.date).toLowerCase().includes(q)));count.textContent=visible.length+" of "+posts.length+" articles";grid.innerHTML=visible.length?visible.map(p=>'<a class="card" href="'+p.slug+'"><div class="meta">'+[p.date,p.readTime].filter(Boolean).join(" · ")+'</div><h2>'+p.icon+' '+p.title+'</h2><p>'+p.excerpt+'</p><span class="read">Read Article →</span></a>').join(""):'<div class="empty">No articles match that search.</div>'}
search.addEventListener("input",render);
fetch("/posts.json").then(r=>r.json()).then(data=>{posts=data;render()}).catch(()=>grid.innerHTML='<div class="empty">Could not load the archive.</div>');
</script></body></html>
