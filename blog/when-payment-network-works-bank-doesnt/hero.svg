<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="t d"><title id="t">A banking payment exception during a network uptime event</title><desc id="d">Editorial operations-desk illustration: the payment network remains healthy while a bank processing system shows a delay, with an unresolved transaction at the center.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102740"/><stop offset=".6" stop-color="#193856"/><stop offset="1" stop-color="#0c1d32"/></linearGradient><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#1c4564"/><stop offset="1" stop-color="#112a43"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#06121e" flood-opacity=".5"/></filter></defs><rect width="1440" height="620" fill="url(#bg)"/><path d="M0 445 Q300 368 600 460 T1440 430V620H0Z" fill="#0c2138" opacity=".52"/><g stroke="#456d88" stroke-opacity=".25" fill="none"><path d="M0 100H1440M0 195H1440M0 290H1440M0 385H1440M0 480H1440M140 0V620M320 0V620M500 0V620M680 0V620M860 0V620M1040 0V620M1220 0V620"/></g><text x="82" y="84" fill="#ffb467" font-family="monospace" font-size="18" letter-spacing="5">AETHERUM BLOG / PAYMENTS OPERATIONS</text><g filter="url(#shadow)"><rect x="76" y="141" width="605" height="345" rx="22" fill="url(#screen)" stroke="#5c8aaa" stroke-width="2"/><rect x="97" y="164" width="563" height="59" rx="10" fill="#122d45"/><circle cx="125" cy="194" r="10" fill="#52d4a9"/><text x="150" y="202" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#f4f7fb">PAYMENT NETWORK</text><rect x="480" y="179" width="156" height="31" rx="15" fill="#1d604f"/><text x="558" y="200" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" font-weight="700" fill="#b4f7dc">OPERATIONAL</text><g fill="none" stroke="#67b6c9" stroke-width="5"><path d="M149 342H605"/><circle cx="189" cy="342" r="16" fill="#163b53"/><circle cx="338" cy="342" r="16" fill="#163b53"/><circle cx="488" cy="342" r="16" fill="#163b53"/><circle cx="595" cy="342" r="16" fill="#163b53"/></g><text x="117" y="268" fill="#b8d2e5" font-size="18" font-family="monospace">NETWORK HEALTH</text><text x="117" y="426" fill="#d6e7f2" font-size="20" font-family="Arial,sans-serif">Connectivity ≠ completed payment</text><rect x="763" y="141" width="598" height="345" rx="22" fill="url(#screen)" stroke="#5c8aaa" stroke-width="2"/><rect x="784" y="164" width="556" height="59" rx="10" fill="#122d45"/><circle cx="814" cy="194" r="10" fill="#f7931a"/><text x="840" y="202" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#f4f7fb">BANK PROCESSING</text><rect x="1186" y="179" width="130" height="31" rx="15" fill="#68452b"/><text x="1251" y="200" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" font-weight="700" fill="#ffd1a4">DELAYED</text><path d="M832 342H1273" stroke="#8b6f58" stroke-width="5" stroke-dasharray="14 13"/><path d="M896 320l24 23-24 23M1039 320l24 23-24 23" stroke="#b88a5a" stroke-width="5" fill="none"/><circle cx="1205" cy="342" r="32" fill="#f7931a"/><path d="M1205 321v27m0 12v3" stroke="#142741" stroke-width="6" stroke-linecap="round"/><text x="802" y="268" fill="#b8d2e5" font-size="18" font-family="monospace">TRANSACTION STATUS</text><text x="802" y="426" fill="#d6e7f2" font-size="20" font-family="Arial,sans-serif">Acknowledged? Pending? Settled?</text></g><g><rect x="500" y="510" width="440" height="64" rx="12" fill="#f7931a"/><text x="720" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#142640">UNCERTAIN ≠ FAILED</text></g><text x="1370" y="590" text-anchor="end" font-family="monospace" font-size="14" fill="#7fa0b8">ILLUSTRATION · NOT A LIVE STATUS DISPLAY</text></svg>